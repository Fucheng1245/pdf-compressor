[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcompressor-local"
version = "0.1.0"
description = "Local PDF compression with three macOS Finder Quick Actions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Fucheng Niu"}]
dependencies = ["pypdf==6.10.0", "Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pdfcompress = "pdfcompressor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pdfcompressor = ["native/*.m"]
