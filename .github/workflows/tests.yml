name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - name: Compile native progress window
        if: runner.os == 'macOS'
        run: clang -O2 -fobjc-arc -fblocks -framework Cocoa src/pdfcompressor/native/Progress.m -o "$RUNNER_TEMP/PDFCompressorProgress"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Check distributable contents
        run: |
          python - <<'PY'
          import glob, zipfile, tarfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              assert 'pdfcompressor/native/Progress.m' in wheel.namelist()
          with tarfile.open(glob.glob('dist/*.tar.gz')[0]) as source:
              names = source.getnames()
              assert any(name.endswith('/scripts/install.py') for name in names)
              assert any(name.endswith('/scripts/uninstall.py') for name in names)
          PY
